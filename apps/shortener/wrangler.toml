name = "stash-shortener"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Bind the KV namespace before deploying:
#   wrangler kv namespace create STASH_KV
#   wrangler kv namespace create STASH_KV --preview
# then paste the ids below.
[[kv_namespaces]]
binding = "STASH_KV"
id = "4778f672faff4aa1899ca0cae42354e6"
preview_id = "5f672e5317c849f7a7b50ec4aa138607"

# brotli-wasm's "exports" map hides pkg.web; alias to a vendored copy
# (plain JS + wasm passed to init(), workerd-compatible)
[alias]
brotli-wasm-web = "./src/vendor/brotli_wasm.js"

# Compile the wasm at build time (workerd forbids runtime wasm compilation)
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

# Per-IP, per-PoP rate limiting (Workers ratelimit binding, free tier)
[[ratelimits]]
name = "RL_STASH"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "RL_MCP"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 60
  period = 60

# Anonymous aggregate telemetry: route/client_class/status/ttl_bucket/origin
# dimensions only — no URLs, titles, or user identifiers. Free tier, no
# dataset pre-creation needed (created on first write).
[[analytics_engine_datasets]]
binding = "STASH_ANALYTICS"
