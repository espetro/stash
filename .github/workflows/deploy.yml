name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# The viewer deploys itself via Cloudflare Pages Git integration.
# This workflow only deploys the shortener Worker.
#
# Required secrets (repo Settings → Secrets and variables → Actions):
# - CLOUDFLARE_ACCOUNT_ID
# - CLOUDFLARE_API_TOKEN (Workers scripts edit permission)

concurrency:
  group: shortener-deploy
  cancel-in-progress: false

jobs:
  deploy-shortener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy shortener worker
        run: pnpm --filter @stash/shortener exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
