name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Typecheck extension
        run: pnpm --filter stash-extension exec tsc --noEmit

      - name: Sync viewer content types
        run: pnpm --filter stash-viewer run sync

      - name: Typecheck viewer
        run: pnpm --filter stash-viewer exec tsc --noEmit

      - name: Validate (tscheck + lint + format)
        run: pnpm run validate

      - name: Build
        run: pnpm build
        env:
          VITE_VIEWER_ORIGIN: https://stash.illo.fyi

      - name: Validate e2e steps (dry-run)
        run: pnpm --filter @stash/e2e run validate:steps

      - name: Run e2e tests
        run: pnpm --filter @stash/e2e exec playwright test --reporter=list
        env:
          CI: 'true'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: apps/extension/.output/
          if-no-files-found: warn

      - name: Upload viewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-build
          path: apps/viewer/dist/
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          if-no-files-found: ignore
