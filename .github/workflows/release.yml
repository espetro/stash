name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get extension version
        id: pkg
        run: echo "version=$(node -p "require('./apps/extension/package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and zip extension
        working-directory: apps/extension
        run: pnpm run zip:${{ matrix.browser }}
        env:
          VITE_VIEWER_ORIGIN: https://stash.illo.fyi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: apps/extension/.output/stashextension-${{ steps.pkg.outputs.version }}-${{ matrix.browser }}.zip
          retention-days: 3
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the previous tag resolve works

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build release notes for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract only this version's section from the changelog:
          # from "## <version>" up to (not including) the next "## " heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "$" { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $VERSION; falling back to generated notes." >&2
          fi
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          {
            cat release-notes.md
            echo ""
            echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
          } > final-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: final-notes.md
          files: artifacts/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get extension version
        id: pkg
        run: echo "version=$(node -p "require('./apps/extension/package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Zip sources for AMO review
        run: git archive --format=zip --output=artifacts/extension-sources.zip HEAD

      # Firefox is always submitted (AMO JWT creds exist). Chrome is gated on
      # vars.CHROME_PUBLISH_ENABLED — flip it once the v2 service-account
      # secrets are set. See .agents/docs/store-publishing.md.
      - name: Submit to Firefox AMO
        working-directory: apps/extension
        run: |
          pnpm exec publish-extension \
            --firefox-zip "../../artifacts/stashextension-${{ steps.pkg.outputs.version }}-firefox.zip" \
            --firefox-sources-zip "../../artifacts/extension-sources.zip"
        env:
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed

      - name: Submit to Chrome Web Store
        if: vars.CHROME_PUBLISH_ENABLED == 'true'
        working-directory: apps/extension
        run: |
          pnpm exec publish-extension \
            --chrome-zip "../../artifacts/stashextension-${{ steps.pkg.outputs.version }}-chrome.zip" \
            --chrome-api-version v2
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
